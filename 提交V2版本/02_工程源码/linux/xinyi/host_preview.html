<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>芯弈一号 · 原生 GUI1080 合成预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e8;color:#343d37;font-family:system-ui,"Microsoft YaHei",sans-serif}
header{padding:12px 20px;border-bottom:1px solid #ded8ca;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
strong{color:#974d2e}small{color:#486657}main{max-width:1600px;margin:auto;padding:12px}.stage{position:relative;aspect-ratio:16/9;background:#f4f0e8;box-shadow:0 4px 24px #343d3716;border-radius:12px;overflow:hidden}.stage img{width:100%;height:100%;display:block;user-select:none}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:8px}.hotspot:focus-visible{outline:4px solid #974d2e}.hotspot:hover{box-shadow:inset 0 0 0 2px #974d2e55}.hotspot:disabled{cursor:wait}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:16px 0}button,select{font:inherit;color:inherit;background:#fffdf7;border:1px solid #ded8ca;padding:9px 14px;border-radius:8px}button:hover{background:#eee7d6}button:disabled{opacity:.45}#status{font-size:14px;min-height:24px}kbd{background:#fffdf7;border:1px solid #ded8ca;padding:2px 6px;border-radius:4px}p{font-size:13px;line-height:1.7;color:#65776d;margin:6px 0}.scope{border-left:3px solid #974d2e;padding:4px 12px}
</style>
<header><strong>HOST 合成预览</strong><small>实际 C 控制层 + main GUI1080 RGB565 渲染；非网页另画棋盘，无实板测量。</small></header>
<main><div class="stage"><img id="frame" alt="芯弈一号原生1080p界面"><div id="hotspots"></div></div>
<div class="controls"><label>合成场景 <select id="scenario"><option value="valid">正常盘面</option><option value="third-rook">第三辆车 · 低置信删除</option><option value="duplicate">同格重复 · 留高置信</option><option value="missing-king">缺将 · 显示但不荐着</option><option value="geometry-failure">几何失败 · 保留前盘</option></select></label><button id="capture">空格拍照</button><button id="say">合成语音：炮二平五</button><button id="badvoice">合成无效语音</button><button id="cancel">取消 / Esc</button></div>
<div id="status" role="status" aria-live="polite"></div>
<p>点击画面里的开始游戏、模式切换、返回首页、CoreMark 测试。<kbd>空格</kbd> 仅在图像模式拍照，<kbd>Esc</kbd> 请求安全取消。棋盘没有手动四角或走子入口。</p>
<div class="scope"><p>所有识别盘面、置信度、耗时、语音文本与荐着均为合成测试。CoreMark 只演示进度与取消，完成后不会更新预置历史参考分。≥85% 为目标；整数识别尚未验收。</p><p>21ms 是 NNUE 热态参考；冷态 CPU151ms→硬件22ms 约6.8×。分类器B32约5.35×是分支参考；全图加速待测，不同身份和口径不混算。</p></div>
</main>
<script>
'use strict';let state=null,pending=null,busy=false,last='',revision=0;
const $=id=>document.getElementById(id);function hotspot(event,label,x,y,w,h){const b=document.createElement('button');b.className='hotspot';b.title=label;b.setAttribute('aria-label',label);Object.assign(b.style,{left:x/19.2+'%',top:y/10.8+'%',width:w/19.2+'%',height:h/10.8+'%'});b.onclick=()=>send(event);b.disabled=!!state.cancelling;$('hotspots').append(b)}
function update(s){state=s;const serial=JSON.stringify(s);if(serial!==last){last=serial;$('frame').src='/frame.png?revision='+ ++revision;}$('status').textContent=s.message+' · 麦克风'+(s.microphone?'开':'关')+' · '+(s.job?'任务进行中':'空闲');$('hotspots').replaceChildren();const events={1:'start',2:'coremark',3:'cancel',4:s.mode?'coach':'voice',5:'home',6:'coremark-log',7:'coremark-log-close',8:'coremark-log-prev',9:'coremark-log-next',10:'coremark-reference'};for(const t of s.actions)hotspot(events[t.action],events[t.action],t.x,t.y,t.w,t.h);$('capture').disabled=!(s.page===1&&s.mode===0&&s.job===0);$('say').disabled=$('badvoice').disabled=!(s.page===1&&s.mode===1&&s.job===0);$('cancel').disabled=!s.job||!!s.cancelling;$('scenario').disabled=!!s.job;clearTimeout(pending);if(s.job)pending=setTimeout(refresh,220);}
async function refresh(){try{const r=await fetch('/state');update(await r.json())}catch(e){$('status').textContent='本机预览已停止。'+e.message}}
async function send(event){if(busy)return;busy=true;try{const r=await fetch('/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event})});update(await r.json())}catch(e){$('status').textContent=e.message}finally{busy=false}}
$('capture').onclick=()=>send('capture');$('say').onclick=()=>send('say');$('badvoice').onclick=()=>send('say-invalid');$('cancel').onclick=()=>send('cancel');$('scenario').onchange=e=>send('scenario-'+e.target.value);
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,button'))return;if(e.code==='Space'){e.preventDefault();send('capture')}else if(e.code==='Escape'){e.preventDefault();send('cancel')}});refresh();
</script></html>
